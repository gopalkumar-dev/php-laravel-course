<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flexbox First Class</title>
        <link rel="stylesheet" href="style.css" />
        
    </head>
    <body>
        <div class="container">
            <div class="one">
                <div class="logo">
                    <img
                        src="images/gopals-logo.png"
                        alt="logo"
                        class="logo-img"
                    />
                </div>
                <div class="web-title">
                    <h5>opal's Tech</h5>
                </div>
            </div>

            <div class="two">
                <div class="select-area">
                    <select name="select" id="select">
                        <option value="" disabled>Select One</option>

                        <optgroup label="Front End">
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="js">JS</option>
                        </optgroup>

                        <optgroup label="Back End">
                            <option value="html">PHP</option>
                            <option value="css">LARAVEL</option>
                            <option value="js">MySQL</option>
                        </optgroup>
                    </select>
                </div>

                <div class="search-area">
                    <div class="search">
                        <input type="url" placeholder="Search Here..." />
                    </div>
                </div>

                <div class="button-area">
                    <button type="submit" value="submit">Submit</button>
                </div>
            </div>

            <div class="three">

                <div class="social-area">
                    <a href="https://www.facebook.com/" target="_blank"><img src="images/fb-logo.png" alt="" class="logo-width"></a>
                    
                    <a href="https://www.whatsapp.com/" target="_blank"><img src="images/whatsapp.png" alt="" class="logo-width"></a>

                    <a href="https://www.instagram.com/" target="_blank"><img src="images/insta-logo.webp" alt="" class="logo-width"></a>
                </div>

            </div>
            
        </div>
    </body>
</html>
