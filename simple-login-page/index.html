<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simple Login Page</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="header-area">
                <div class="logo">
                    <h1>Gopal's Tech</h1>
                </div>
                <div class="links">
                    <div class="navigation">
                        <ul>
                            <li>
                                <a href=""
                                    ><img
                                        src="images/phone-call.png"
                                        alt=""
                                        width="25px"
                                /></a>
                            </li>
                            <li>
                                <a href=""
                                    ><img
                                        src="images/envelope.png"
                                        alt=""
                                        width="25px"
                                /></a>
                            </li>
                            <li>
                                <a href=""
                                    ><img
                                        src="images/marker.png"
                                        alt=""
                                        width="25px"
                                /></a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="login-container">
                <div class="left-box">
                    <div class="image">
                        <img
                            src="images/ylanite_nietjuhart-plant-8770937_640.jpg"
                            alt=""
                            width="190px"
                        />
                    </div>
                </div>
                <div class="right-box">
                    <h2>Sign In</h2>
                    <div class="signin-form">
                        <form action="">
                            <input
                                type="text"
                                name="user-id"
                                id="user-id"
                                placeholder="User Id"
                            />
                            <br />
                            <br />
                            <input
                                type="password"
                                name="pass"
                                id="pass"
                                placeholder="Password"
                            />
                            <br /><br />
                            <button type="submit" id="submit" value="form-data">
                                <strong>Submit</strong>
                            </button>
                            &nbsp;
                            <button type="reset" id="reset">
                                <strong>Reset</strong>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
